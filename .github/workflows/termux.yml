name: Termux aarch64

# 只为 Termux（glibc aarch64）出包：
# - 原生 arm64 runner 上直接编 aarch64-unknown-linux-gnu（不走 Docker/cross，
#   ubuntu-24.04 的 glibc 2.39 < Termux glibc 2.44 → 向下兼容可跑）；
# - 产物含裸二进制 + tar.gz + sha256，Actions 里可直接下载。
on:
    workflow_dispatch:
    push:
        branches: [main, pi-model-list]
        tags: ["termux-v*"]

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Test (model selector)
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  key: termux-test
            - name: Run model panel tests
              run: cargo test -p peri-tui --lib -- model

    build:
        name: Build peri (aarch64-linux-gnu)
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-unknown-linux-gnu

            - uses: Swatinem/rust-cache@v2
              with:
                  key: termux-aarch64

            - name: Build release binary
              run: cargo build -p peri-tui --release --target aarch64-unknown-linux-gnu

            - name: Package
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  cp target/aarch64-unknown-linux-gnu/release/peri dist/peri-linux-aarch64
                  chmod +x dist/peri-linux-aarch64
                  cp dist/peri-linux-aarch64 dist/peri
                  tar -czf dist/peri-linux-aarch64.tar.gz -C dist peri-linux-aarch64
                  (cd dist && sha256sum peri-linux-aarch64 > peri-linux-aarch64.sha256)
                  ls -l dist/

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: peri-linux-aarch64
                  path: dist/
                  retention-days: 30

    release:
        name: Attach to release
        if: startsWith(github.ref, 'refs/tags/termux-v')
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts/
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/*
                  generate_release_notes: true
